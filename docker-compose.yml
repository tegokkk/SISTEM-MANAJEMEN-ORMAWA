services:
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api/v1
    environment:
      NODE_ENV: production
      INTERNAL_API_URL: http://backend:4000
      NEXT_PUBLIC_API_URL: /api/v1
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: mysql://sim_user:sim_password@db:3306/sim_ormawa_hmj
      SESSION_SECRET: change-this-development-secret-before-production
      COOKIE_NAME: sim_session
      COOKIE_SECURE: "false"
      FRONTEND_URL: http://localhost:8080
      FILE_STORAGE_DRIVER: local
      FILE_STORAGE_PATH: /app/backend/storage/uploads
      MAX_UPLOAD_SIZE_MB: 10
      LOG_LEVEL: info
    volumes:
      - upload_data:/app/backend/storage/uploads
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: sim_ormawa_hmj
      MYSQL_USER: sim_user
      MYSQL_PASSWORD: sim_password
      MYSQL_ROOT_PASSWORD: local_root_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/sim_ormawa_hmj.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-plocal_root_password"]
      interval: 10s
      timeout: 5s
      retries: 15

volumes:
  db_data:
  upload_data:
